name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licences:
    name: dependency licences (ADR-0007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --format-version 1 | python3 tools/check_licences.py

  desktop:
    name: desktop app (UI tests, licences, Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI install, licences, tests, build
        working-directory: app/ui
        run: |
          npm ci
          npm run licences
          npm test
          npm run build
      - name: Trace graph browser checks (recorded traces, no network)
        working-directory: app/ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Desktop shell lint and build
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings
      - name: Desktop shell licences (ADR-0009)
        run: cargo metadata --format-version 1 --manifest-path app/src-tauri/Cargo.toml | python3 tools/check_licences.py --allow MPL-2.0
