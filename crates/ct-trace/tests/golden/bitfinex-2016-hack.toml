[case]
id = "bitfinex-2016-hack"
title = "2016 Bitfinex hack: stolen coins dormant for 6 years, consolidated on 2022-02-01 into the address the US seized ~94,6xx BTC from"
document = "Statement of facts, Case 1:22-mj-00022-RMM (D.D.C.), filed 02/07/22, ¶¶ 4–6: https://www.justice.gov/archives/opa/press-release/file/1470211/dl?inline="
quote = """¶4: "the hacker was able to initiate over 2,000 unauthorized BTC transactions, in which \
approximately 119,754 BTC was transferred from Victim VCE's wallets to an outside wallet \
(Wallet 1CGA4s)" ¶6: "Between January 31, 2022, and February 1, 2022, law enforcement [...] \
used the private keys from LICHTENSTEIN's file to seize Wallet 1CGA4's remaining balance of \
approximately 94,636 BTC\""""
status = """Read against the statement of facts (2026-11-26): it confirms the hack and the \
seizure of ~94,636 BTC on 31 Jan–1 Feb 2022, but names the wallet only as "Wallet 1CGA4s" \
(footnote 5: wallets are named by the first six characters of an associated address) and gives \
no full address or txid. The link between this seed, bc1qazcm… (94,643 BTC received on \
2022-02-01) and that seizure is an on-chain inference (hack-window origin, date, amount); no \
address in the recorded transactions starts with 1CGA4s. Kept as a regression test for the \
dormancy rule, not as a document-verified case."""
recording = "bitfinex-2016-hack.json"

[trace]
direction = "forward"
txid = "01c7cdfe8ff23da7ab14a1a30e84373fe3f0d45f428de3c5cbf72253ca807904"
vout = 0
max_hops = 2
max_txs = 20

[[expect]]
address = "bc1qazcm763858nkj2dj986etajv6wquslv8uxwczt"
min_sats = 10_900_000_000
why = """the 109 BTC output reaches the seized wallet in one hop, and its change does too, two hops later, through another of the thief's consolidations (which must not be mistaken for a service sweep: dormancy rule)"""
