[package]
name = "ct-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ct-core = { version = "0.1.0", path = "../ct-core" }
ct-heuristics = { version = "0.1.0", path = "../ct-heuristics" }
ct-labels = { version = "0.1.0", path = "../ct-labels" }
ct-providers = { version = "0.1.0", path = "../ct-providers" }
ct-store = { version = "0.1.0", path = "../ct-store" }
ct-trace = { version = "0.1.0", path = "../ct-trace" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
