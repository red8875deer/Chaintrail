[package]
name = "ct-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
ct-core = { version = "0.1.0", path = "../ct-core" }
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
