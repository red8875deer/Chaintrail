[package]
name = "ct-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
ct-core = { version = "0.1.0", path = "../ct-core" }
ct-heuristics = { version = "0.1.0", path = "../ct-heuristics" }
ct-labels = { version = "0.1.0", path = "../ct-labels" }
ct-providers = { version = "0.1.0", path = "../ct-providers" }
ct-service = { version = "0.1.0", path = "../ct-service" }
ct-store = { version = "0.1.0", path = "../ct-store" }
ct-trace = { version = "0.1.0", path = "../ct-trace" }
getrandom = "0.4.3"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[lints]
workspace = true
